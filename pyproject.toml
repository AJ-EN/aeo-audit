[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeo-audit"
version = "1.0.0"
description = "CLI tool to scan websites and score their Agent/Engine Optimization (AEO) readiness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ayush Jangid" },
]
keywords = ["aeo", "audit", "agent", "seo", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13.0,<14",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "playwright>=1.40,<2",
    "httpx>=0.27,<1",
    "extruct>=0.17,<1",
    "openapi-spec-validator>=0.7,<1",
    "jsonschema>=4.20,<5",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "dnspython>=2.4,<3",
    "aiofiles>=23.0,<25",
    "cryptography>=42.0,<44",
    "python-jose[cryptography]>=3.3,<4",
    "multiformats>=0.2,<1",
    "eth-utils>=4.0,<5",
    "base58>=2.1,<3",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60,<62"]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.12,<4",
    "hypothesis>=6.90,<7",
    "mypy>=1.8,<2",
    "ruff>=0.3,<1",
    "pyinstaller>=6.0,<7",
    "types-pyyaml>=6.0",
    "types-aiofiles>=23.0",
]
all = ["aeo-audit[pdf,dev]"]

[project.scripts]
aeo-audit = "aeo_audit.cli:main"

[project.entry-points."aeo_audit.checks"]
discovery = "aeo_audit.checks.discovery"
identity = "aeo_audit.checks.identity"
capabilities = "aeo_audit.checks.capabilities"
commerce = "aeo_audit.checks.commerce"
trust = "aeo_audit.checks.trust"

[project.urls]
Homepage = "https://github.com/ayushjangid/aeo-audit"
Repository = "https://github.com/ayushjangid/aeo-audit"
Issues = "https://github.com/ayushjangid/aeo-audit/issues"

# --- Tool Configuration ---

[tool.hatch.build.targets.wheel]
packages = ["aeo_audit"]

[tool.hatch.envs.default]
features = [
    "dev",
    "pdf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, mocked)",
    "integration: Integration tests (requires mock server)",
    "contract: Contract tests (interface compliance)",
    "golden: Golden master tests (snapshot comparison)",
    "slow: Slow tests (network, browser)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "extruct.*",
    "playwright.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aeo_audit"]

[tool.coverage.run]
source = ["aeo_audit"]
branch = true
omit = ["aeo_audit/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]
