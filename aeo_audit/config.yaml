# AEO Audit Configuration
# All weights, thresholds, and crawler settings are defined here.
# Override via CLI flags: --weight discovery=0.30

# --- Category Weights (must sum to 1.0) ---
# Foundation-weighted: categories with signals real sites have today (Trust,
# Capabilities, Discovery) drive the score; emerging agent-native dimensions
# (Identity, parts of Commerce) contribute upside without dominating.
weights:
  discovery: 0.25
  identity: 0.10
  capabilities: 0.25
  commerce: 0.15
  trust: 0.25

# --- Per-Check Weights (within each category, must sum to 1.0) ---
# Within each category, foundational signals (things a well-run API exposes
# today) are weighted above frontier agent-native signals so the score
# differentiates real sites instead of collapsing everyone to zero.
checks:
  discovery:
    sitemap_xml: 0.30
    robots_agent: 0.25
    well_known_crawl: 0.15
    agent_manifest: 0.12
    mcp_endpoint: 0.10
    dns_txt_records: 0.08

  identity:
    oauth_metadata: 0.35
    did_document: 0.25
    agent_identity_json: 0.20
    delegation_proof: 0.10
    wallet_hints: 0.10

  capabilities:
    openapi_spec: 0.30
    async_webhooks: 0.25
    json_schema_endpoints: 0.20
    graphql_introspection: 0.13
    mcp_tools_list: 0.12

  commerce:
    stripe_checkout_hints: 0.30
    trial_freemium_signals: 0.30
    usage_metering_api: 0.20
    agent_pricing_json: 0.12
    crypto_payment_hints: 0.08

  trust:
    sla_status_page: 0.30
    structured_errors: 0.30
    health_check: 0.20
    audit_log_endpoint: 0.12
    receipt_verification: 0.08

# --- Grading Thresholds ---
thresholds:
  grade_A: 90
  grade_B: 75
  grade_C: 60
  grade_D: 40

# --- Crawler Settings ---
crawler:
  user_agent: "AEOAuditor/1.0 (+https://github.com/AJ-EN/aeo-audit)"
  timeout: 45
  max_redirects: 5
  cache_ttl: 3600
  concurrent_checks: 10
  respect_robots: true
  # "load" fires on the load event; "networkidle" waits for the network to go
  # quiet, which never happens on sites with long-polling/websockets and causes
  # spurious timeouts. "load" + the __AEO_READY__ signal is faster and stable.
  wait_strategy: "load"
  custom_ready_signal: "__AEO_READY__"

# --- HTTP Client ---
http:
  max_retries: 3
  backoff_factor: 0.5
  rate_limit_rpm: 60
  pool_size: 20

# --- Cache ---
cache:
  enabled: true
  backend: "sqlite"
  db_path: ".aeo_cache.db"
  ttl: 3600

# --- Benchmark Data ---
benchmarks:
  percentile_data: "benchmarks/percentiles_v1.json"
  bootstrap_samples: 1000
  confidence_level: 0.95
  # Relative grading: a site's grade is its percentile rank against the
  # benchmark corpus (A = top 10% of agent-readiness today). Absolute
  # thresholds above are the fallback when no corpus is loaded.
  grade_percentiles:
    A: 90
    B: 70
    C: 40
    D: 15

# --- Reporting ---
reporting:
  html_template: "templates/report.html.j2"
  include_evidence: true
  include_screenshots: false
  badge_threshold: 75
